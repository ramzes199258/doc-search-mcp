name: Build Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker buildx build --load -t doc-search-mcp:latest .

      - name: Install MCP inside container
        run: |
          docker run --rm --entrypoint pip doc-search-mcp:latest install mcp[cli]==1.25.0

      - name: Commit changes back to image
        run: |
          docker commit $(docker run -d --rm --entrypoint sleep doc-search-mcp:latest 3600) doc-search-mcp:latest

      - name: Save image to tar
        run: docker save doc-search-mcp:latest -o doc-search-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: doc-search-image.tar
          retention-days: 7
